type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

type ViewPageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
}

type Meta {
  status: JSON
}

type Query {
  round(id: String!): round
  rounds(where: roundFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int, offset: Int): roundPage!
  commit(id: String!): commit
  commits(where: commitFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int, offset: Int): commitPage!
  participant(id: String!): participant
  participants(where: participantFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int, offset: Int): participantPage!
  vaultFlow(id: String!): vaultFlow
  vaultFlows(where: vaultFlowFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int, offset: Int): vaultFlowPage!
  certificate(id: String!): certificate
  certificates(where: certificateFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int, offset: Int): certificatePage!
  poolSwap(id: String!): poolSwap
  poolSwaps(where: poolSwapFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int, offset: Int): poolSwapPage!
  vaultIndex(id: String!): vaultIndex
  vaultIndexs(where: vaultIndexFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int, offset: Int): vaultIndexPage!
  poolIndex(id: String!): poolIndex
  poolIndexs(where: poolIndexFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int, offset: Int): poolIndexPage!
  _meta: Meta
}

